<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <!-- Sparkle Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Internal Border -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#60a5fa" stroke-width="12" stroke-opacity="0.3" />

  <!-- Store Icon inside -->
  <g transform="translate(128, 128)" fill="#ffffff">
    <!-- Store Roof -->
    <path d="M 128 20 L 24 100 L 232 100 Z" />
    
    <!-- Pillars & Desk -->
    <rect x="44" y="116" width="28" height="100" rx="4" />
    <rect x="180" y="116" width="28" height="100" rx="4" />
    <rect x="112" y="140" width="32" height="76" rx="4" />
    
    <!-- Base -->
    <rect x="24" y="216" width="208" height="20" rx="6" />
  </g>

  <!-- Smart Sparkle in top-right -->
  <g transform="translate(340, 75) scale(1.6)">
    <path d="M0,25 C10,25 15,15 15,0 C15,15 20,25 30,25 C20,25 15,30 15,50 C15,30 10,25 0,25 Z" fill="url(#sparkGrad)" />
  </g>
</svg>
